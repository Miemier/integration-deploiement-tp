services:
  web:
    build: .
    container_name: flask-app
    ports:
      - "5000:5000"
    environment:
      MONGO_HOST: db
      MONGO_PORT: "27017"
    depends_on:
      - db

  db:
    image: mongo:7
    container_name: mongo-db
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
